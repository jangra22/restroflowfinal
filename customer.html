<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganeshwaram | Premium Digital Dining & QR Order Portal</title>
    <meta name="description" content="Secure and fast contactless table ordering app by Ganeshwaram. Browse artisanal recipes, request customizations, and pay instantly.">
    <!-- PWA Configurations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8f9fa">
    
    <link rel="stylesheet" href="css/customer.css">
</head>
<body>

    <!-- IOS Fixed Header Placeholder -->
    <header class="mobile-header" id="header-root">
        <!-- Injected via Header.js component -->
    </header>

    <!-- Main Dynamic Tab Content Placeholders -->
    <main id="tab-content-root" style="padding-top: 0.5rem; padding-bottom: 120px;">
        <!-- Injected dynamically based on active tab -->
    </main>

    <!-- Floating View Cart Sticky Banner -->
    <div class="floating-cart-bar" id="floating-cart-banner" style="display: none;" onclick="custCtrl.openCartDrawer()">
        <div class="floating-cart-left">
            <span class="floating-cart-badge" id="floating-cart-badge-count">0</span>
            <span>View Cart</span>
        </div>
        <span class="floating-cart-price" id="floating-cart-grand-total">₹0.00</span>
    </div>

    <!-- Sliding Checkout Cart Drawer (iOS Style Sheet) -->
    <div class="ios-sheet" id="cart-drawer-root" onclick="custCtrl.closeCartDrawer()">
        <div class="ios-sheet-content" id="cart-drawer-content" onclick="event.stopPropagation()">
            <!-- Injected via CartDrawer.js component -->
        </div>
    </div>

    <!-- Sliding Add-on Customizer Drawer (iOS Style Sheet) -->
    <div class="ios-sheet" id="customizer-sheet" onclick="custCtrl.closeCustomizerSheet(event)">
        <!-- Injected via CustomizerSheet.js component -->
    </div>

    <!-- IOS Fixed Bottom Tab Navigator Bar (Premium 5 Tabs) -->
    <nav class="tab-bar" style="grid-template-columns: repeat(5, 1fr);">
        <button class="tab-item active" id="tab-nav-menu" onclick="custCtrl.switchMobileView('menu')">
            <span class="tab-icon">🍴</span>
            Menu
        </button>
        <button class="tab-item" id="tab-nav-orders" onclick="custCtrl.switchMobileView('orders')">
            <span class="tab-icon">📋</span>
            Orders
        </button>
        <button class="tab-item" id="tab-nav-kitchen" onclick="custCtrl.switchMobileView('kitchen')">
            <span class="tab-icon">👨‍🍳</span>
            Kitchen
        </button>
        <button class="tab-item" id="tab-nav-events" onclick="custCtrl.switchMobileView('events')">
            <span class="tab-icon">🎟️</span>
            Events
        </button>
        <button class="tab-item" id="tab-nav-profile" onclick="custCtrl.switchMobileView('profile')">
            <span class="tab-icon">👤</span>
            Profile
        </button>
    </nav>

    <!-- Script references -->
    <script type="module" src="js/app-customer.js"></script>
</body>
</html>
